# Verified remote application of a gzip+Base64 connector patch payload.
# Replace YOUR_BRANCH, trigger path, payload path, and expected manifests before use.
# Validate the resulting workflow YAML before publication.
# The applied patch is forbidden from modifying .github/workflows/**.
name: Apply Connector Patch Payload

on:
  push:
    branches:
      - YOUR_BRANCH
    paths:
      - .agents/connector-triggers/apply-patch.txt

permissions:
  contents: write

concurrency:
  group: connector-apply-patch-${{ github.ref }}
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/connector-apply-patch-logs
  ACTIVITY_LOG: /tmp/connector-apply-patch-logs/activity.log
  PAYLOAD_DIR: .agents/patches/change
  ENCODED_FILE: /tmp/connector-change.patch.b64
  PATCH_FILE: /tmp/connector-change.patch

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, verify, and apply patch
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1

          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "exit_code=$rc"
              echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git status --short --branch || true
              git diff --stat || true
              git diff --cached --stat || true
            } | tee -a "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT

          patch_digest_file="$PAYLOAD_DIR/change.patch.sha256"
          encoded_digest_file="$PAYLOAD_DIR/change.patch.b64.sha256"
          expected_paths_file="$PAYLOAD_DIR/expected-paths.txt"
          expected_blobs_file="$PAYLOAD_DIR/expected-blobs.tsv"

          test -f "$patch_digest_file"
          test -f "$encoded_digest_file"
          test -f "$expected_paths_file"
          test -f "$expected_blobs_file"

          mapfile -d '' parts < <(find "$PAYLOAD_DIR" -maxdepth 1 -type f \
            -name 'change.patch.b64.part-*' -print0 | LC_ALL=C sort -z)
          test "${#parts[@]}" -gt 0

          : > "$ENCODED_FILE"
          for part in "${parts[@]}"; do
            bytes=$(wc -c < "$part")
            test "$bytes" -le 19000
            cat "$part" >> "$ENCODED_FILE"
          done

          expected_encoded=$(awk '{print $1}' "$encoded_digest_file")
          actual_encoded=$(sha256sum "$ENCODED_FILE" | awk '{print $1}')
          test "$actual_encoded" = "$expected_encoded"

          base64 --decode "$ENCODED_FILE" | gzip -dc > "$PATCH_FILE"

          expected_patch=$(awk '{print $1}' "$patch_digest_file")
          actual_patch=$(sha256sum "$PATCH_FILE" | awk '{print $1}')
          test "$actual_patch" = "$expected_patch"

          if grep -Eq '^(---|\+\+\+) [ab]/\.github/workflows/' "$PATCH_FILE"; then
            echo "Patch modifies .github/workflows/**, which is forbidden." >&2
            exit 2
          fi

          normalize_paths() {
            sed '/^[[:space:]]*$/d' "$1" | LC_ALL=C sort -u
          }

          outputs_match() {
            local expected path actual
            while IFS=$'\t' read -r expected path; do
              test -n "$expected" || continue
              test -n "$path" || return 1
              if [[ "$expected" == "DELETE" ]]; then
                [[ ! -e "$path" ]] || return 1
                continue
              fi
              [[ -f "$path" ]] || return 1
              actual=$(git hash-object "$path")
              [[ "$actual" == "$expected" ]] || return 1
            done < "$expected_blobs_file"
          }

          if outputs_match; then
            echo "All expected outputs already match; verified no-op."
            exit 0
          fi

          git apply --check "$PATCH_FILE"
          git apply --index "$PATCH_FILE"
          git diff --check --cached

          actual_paths_file=/tmp/actual-paths.txt
          expected_sorted_file=/tmp/expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort -u > "$actual_paths_file"
          normalize_paths "$expected_paths_file" > "$expected_sorted_file"
          if ! cmp -s "$actual_paths_file" "$expected_sorted_file"; then
            echo "Changed-path set differs from intended patch scope." >&2
            echo "Expected:" >&2
            cat "$expected_sorted_file" >&2
            echo "Actual:" >&2
            cat "$actual_paths_file" >&2
            exit 3
          fi

          if ! outputs_match; then
            echo "Post-apply output blob verification failed." >&2
            exit 4
          fi

          if git diff --cached --quiet; then
            echo "No staged changes after verified application."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply verified connector patch"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-apply-patch-logs-${{ github.run_id }}
          path: /tmp/connector-apply-patch-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
