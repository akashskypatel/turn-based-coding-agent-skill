name: Integrate GitHub Connector Workflows Module

on:
  push:
    branches:
      - agent/integrate-github-connector-workflows
    paths:
      - .agents/connector-triggers/integrate-github-connector-workflows.txt
  pull_request:
    branches:
      - master
    paths:
      - .agents/connector-triggers/integrate-github-connector-workflows.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-github-connector-workflows-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/integrate-github-connector-workflows
  LOG_DIR: /tmp/integrate-github-connector-workflows-logs
  ACTIVITY_LOG: /tmp/integrate-github-connector-workflows-logs/activity.log
  PAYLOAD_DIR: .agents/connector-payloads/github-connector-workflows
  PAYLOAD_TGZ: /tmp/github-connector-workflows.tar.gz
  PAYLOAD_SHA256: 135f164cc3b7c96a701711af9e0baa30dc7b3ebc431fc465a9ab9d2f77572bbd

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent activity log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "task=integrate-github-connector-workflows"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "target_branch=$TARGET_BRANCH"
            echo "repository=$GITHUB_REPOSITORY"
            echo "runner_os=$RUNNER_OS"
            echo "runner_temp=$RUNNER_TEMP"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-github-connector-workflows
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, validate, and commit integration
        id: integrate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR"
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1

          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "exit_code=$rc"
              echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "final_head=$(git rev-parse HEAD 2>/dev/null || true)"
              echo "final_status_begin"
              git status --short --branch || true
              echo "final_status_end"
              echo "disk_usage_begin"
              df -h . || true
              du -sh . /tmp/github-connector-workflows-* 2>/dev/null || true
              echo "disk_usage_end"
            } | tee -a "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT

          echo "tool_versions_begin"
          git --version
          tar --version | head -n 1
          python3 --version
          sha256sum --version | head -n 1
          echo "tool_versions_end"

          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          echo "checked_out_sha=$local_sha"
          echo "remote_branch_sha=$remote_sha"
          test "$local_sha" = "$remote_sha"
          test -d "$PAYLOAD_DIR"

          mapfile -d '' payload_parts < <(find "$PAYLOAD_DIR" -maxdepth 1 -type f -name 'part-*' -print0 | LC_ALL=C sort -z)
          echo "payload_part_count=${#payload_parts[@]}"
          test "${#payload_parts[@]}" -eq 8
          cat "${payload_parts[@]}" | base64 --decode > "$PAYLOAD_TGZ"

          actual_sha=$(sha256sum "$PAYLOAD_TGZ" | awk '{print $1}')
          echo "payload_sha256=$actual_sha"
          test "$actual_sha" = "$PAYLOAD_SHA256"

          rm -rf /tmp/github-connector-workflows-extract
          mkdir -p /tmp/github-connector-workflows-extract
          tar -xzf "$PAYLOAD_TGZ" -C /tmp/github-connector-workflows-extract

          if find /tmp/github-connector-workflows-extract -path '*/.github/workflows/*' -print -quit | grep -q .; then
            echo "Payload attempts to modify .github/workflows/**" >&2
            exit 2
          fi

          set -x
          cp -a /tmp/github-connector-workflows-extract/README.md ./README.md
          cp -a /tmp/github-connector-workflows-extract/turn-based-coding-agent/. ./turn-based-coding-agent/
          rm -f .agents/connector-triggers/integrate-github-connector-workflows.txt
          rm -rf "$PAYLOAD_DIR"
          rmdir .agents/connector-triggers 2>/dev/null || true
          rmdir .agents/connector-payloads 2>/dev/null || true
          rmdir .agents 2>/dev/null || true
          set +x

          test "$(cat turn-based-coding-agent/VERSION)" = "1.2.0"
          test -f turn-based-coding-agent/references/10-github-connector-workflows.md
          test -f turn-based-coding-agent/references/github-connector-workflows/COMMON_TASKS.md
          test -f turn-based-coding-agent/references/github-connector-workflows/PITFALLS.md
          test -f turn-based-coding-agent/references/github-connector-workflows/TOOL_MAP.md
          test -f turn-based-coding-agent/templates/github-actions/logged-remote-task.yml
          test -f turn-based-coding-agent/templates/github-actions/apply-unified-patch.yml
          test -f turn-based-coding-agent/scripts/split_patch.py

          python3 - <<'PY'
          from pathlib import Path
          root = Path('turn-based-coding-agent')
          missing = []
          duplicates = []
          seen = set()
          for raw in (root / 'manifest.txt').read_text(encoding='utf-8').splitlines():
              path = raw.strip()
              if not path:
                  continue
              if path in seen:
                  duplicates.append(path)
              seen.add(path)
              if not (root / path).is_file():
                  missing.append(path)
          print(f'manifest_entries={len(seen)}')
          print(f'manifest_missing={missing}')
          print(f'manifest_duplicates={duplicates}')
          if missing or duplicates:
              raise SystemExit(1)
          PY

          git diff --check
          echo "changed_files_begin"
          git status --short
          echo "changed_files_end"

          git add README.md turn-based-coding-agent .agents
          if git diff --cached --quiet; then
            echo "Integration already matches expected content; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: integrate GitHub connector workflows module"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Write success summary
        if: steps.integrate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "integration_result=success"
            echo "result_head=$(git rev-parse HEAD)"
            echo "version=$(cat turn-based-coding-agent/VERSION)"
          } | tee -a "$ACTIVITY_LOG" > "$LOG_DIR/result.txt"

      - name: Upload integration result evidence
        if: steps.integrate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: github-connector-workflows-integration-result-${{ github.run_id }}
          path: /tmp/integrate-github-connector-workflows-logs/result.txt
          if-no-files-found: error
          retention-days: 14

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-connector-workflows-integration-logs-${{ github.run_id }}
          path: /tmp/integrate-github-connector-workflows-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
